<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmark | withlionbuddha</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    .bookmark-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.94);
      border-bottom: 1px solid #e9ecef;
      backdrop-filter: blur(10px);
    }

    .bookmark-main {
      padding-top: 92px;
    }

    .bookmark-categories {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
    }

    .bookmark-category {
      min-height: 88px;
      display: flex;
      align-items: center;
      padding: 24px 0;
      border-bottom: 1px solid #e4e7ec;
    }

    .bookmark-category img {
      display: block;
    }

    @media (max-width: 820px) {
      .bookmark-main {
        padding-top: 126px;
      }
    }
  </style>
</head>
<body>
  <header class="bookmark-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">withlionbuddha</a>
      <nav class="nav">
        <a href="index.html#about">About</a>
        <a href="bookmark.html">Bookmark</a>
        <a href="blog/index.html">Blog</a>
        <a href="https://github.com/withlionbuddha" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </div>
  </header>

  <main class="bookmark-main">
    <div class="bookmark-categories">
      <div class="bookmark-category" data-category="computer-vision">
        <a href="https://cs231n.stanford.edu/schedule" target="_blank" rel="noopener" title="Stanford CS231n">
          <img src="https://img.shields.io/badge/Stanford-CS231n-8C1515?style=flat-square" alt="Stanford CS231n" />
        </a>
      </div>

      <div class="bookmark-category" data-category="training-dynamics">
        <a href="https://cs231n.stanford.edu/slides/2025/lecture_7.pdf" target="_blank" rel="noopener" title="CS231n Training Dynamics">
          <img src="https://img.shields.io/badge/CS231n-Training_Dynamics-8C1515?style=flat-square" alt="CS231n Training Dynamics" />
        </a>
      </div>

      <div class="bookmark-category" data-category="deep-learning">
        <a href="https://www.deeplearning.ai/courses/deep-neural-network" target="_blank" rel="noopener" title="DeepLearning.AI Improving Deep Neural Networks">
          <img src="https://img.shields.io/badge/DeepLearning.AI-Improving_DNNs-FF6F00?style=flat-square" alt="DeepLearning.AI Improving DNNs" />
        </a>
      </div>

      <div class="bookmark-category" data-category="learning-resources">
        <a href="https://www.deeplearning.ai/resources" target="_blank" rel="noopener" title="DeepLearning.AI Resources">
          <img src="https://img.shields.io/badge/DeepLearning.AI-Resources-FF6F00?style=flat-square" alt="DeepLearning.AI Resources" />
        </a>
      </div>

      <div class="bookmark-category" data-category="optimization">
        <a href="https://www.d2l.ai/chapter_optimization/index.html" target="_blank" rel="noopener" title="Dive into Deep Learning Optimization">
          <img src="https://img.shields.io/badge/D2L-Optimization-1F6FEB?style=flat-square" alt="Dive into Deep Learning Optimization" />
        </a>
      </div>
    </div>
  </main>
</body>
</html>
